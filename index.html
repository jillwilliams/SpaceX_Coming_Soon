<html lang="en" dir="ltr">
    <head>
        <meta charset="utf-8" Unicode="U+1F334, UTF-8: F0 9F 8C B4" Unicode= "U+1F332, UTF-8: F0 9F 8C B2" Unicode= "U+00A9"  Unicode="U+00A9, UTF-8: C2 A9" Unicode="U+1F440, UTF-8: F0 9F 91 80">
        <title>SpaceX Coming Soon</title>
        <link HREF="https://fonts.googleapis.com/css?family=Dancing+Script|Indie+Flower|Shadows+Into+Light|Fresca|Nunito|Yoyu|Iceland|Gravitas One|Arial|Yeseva One|Tagesschrift|du+NSW+ACT+Cursive|BenchNine|Birthstone|Jolly Lodger" rel="stylesheet">
        <link rel="stylesheet" href="./styles.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://kit.fontawesome.com/9f71dab2a2.js" crossorigin="anonymous"></script>
        <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/> -->

        <!-- <meta name="keywords" content="”> -->
    </head>
    <body>
        <div class="container">
            <div class="opening">
                <img src="images/spacex_logo.png" id="main-logo">
            </div>
            <div class="header">
                <h5>Coming soon.</h5>
                <h1>Something Awesome is Brewing</h1>
                <h3>We are working hard to bring you something special.<br>Be the first to know when we launch.</h3>
            </div>

            <section class="countdown">
                <div class="time-block">
                    <span class="time-value" id="days">00</span>
                    <span class="time-label">Days</span>
                </div>

                <span class="separator">:</span>

                <div class="time-block">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-label">Hours</span>
                </div>

                <span class="separator">:</span>

                <div class="time-block">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-label">Minutes</span>
                </div>

                <span class="separator">:</span>

                <div class="time-block">
                    <span class="time-value" id="seconds">00</span>
                    <span class="time-label">Seconds</span>
                </div>
            </section>

            <div class="flex">
                <div id="email-form">
                    <i class="fa-regular fa-envelope" id="envelope"></i>
                    <input type="text" class="input-email" placeholder="Enter your email">
                </div>
                <div class="submit-btn">
                    <button>
                        Sign Up
                        <i class="fa-solid fa-circle-arrow-right" id="arrow-right"></i>
                    </button>
                </div>
            </div>
            <div class="icons">
                <i class="fa-brands fa-x-twitter" id="twitter"></i>
                <i class="fa-brands fa-instagram" id="instagram"></i>
                <i class="fa-brands fa-discord" id="discord"></i>
            </div>
        </div>

        <script src="app.js"></script>
    </body>
</html>
